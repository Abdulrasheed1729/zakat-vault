name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build & test (contracts + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup show

      - name: Add RISC-V target
        run: rustup target add riscv64imac-unknown-none-elf

      - name: Install clang 16+ (required by contracts/*/Makefile)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          echo "CLANG=$(command -v clang-18)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: make build
        run: make build

      - name: make test
        run: make test
