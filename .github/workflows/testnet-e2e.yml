name: Testnet E2E

# Manually triggered only: this spends real (faucet) testnet CKB on every
# run, so it should not run on every push/PR. Trigger it from the Actions
# tab when you want to smoke-test a deployed contract on CKB testnet.
#
# One-time setup required before this will work (see vault-client/README.md
# and deployment/devnet/sadaqah-lock/ for the devnet equivalent):
#   1. Deploy the contract to testnet yourself:
#        offckb deploy --network testnet --privkey-file <your-funded-key-file>
#      This produces deployment/testnet/sadaqah-lock/ (deployment.toml +
#      migrations) -- commit that directory.
#   2. Fund a dedicated "owner" testnet account (faucet: https://faucet.nervos.org)
#      and one or more "charity" addresses (these just receive funds, no key needed).
#   3. In the repo's Settings -> Secrets and variables -> Actions, add:
#        Secrets:
#          TESTNET_OWNER_PRIVKEY     owner account's private key (hex)
#          TESTNET_CHARITY_ADDRESSES comma-separated charity addresses (1-4)
#        Variables:
#          TESTNET_VAULT_CODE_HASH      from deployment/testnet/.../migrations/*.json
#          TESTNET_VAULT_CODE_TX_HASH   from the same file
#          TESTNET_RPC_URL              optional, defaults to https://testnet.ckbapp.dev/rpc
#          TESTNET_CREATE_AMOUNT_CKB    optional, defaults below -- lower these if your
#          TESTNET_WITHDRAW_AMOUNT_CKB  faucet grant is small. NOTE: the rate used here
#          TESTNET_SHORT_AMOUNT_CKB     is deliberately higher than the contract's normal
#          TESTNET_FINAL_AMOUNT_CKB     default (10% vs. 2.5%) so that 70% of the required
#                                       share on a modest withdrawal still clears the 61 CKB
#                                       minimum cell size -- see the math note below.
on:
  workflow_dispatch: {}

jobs:
  e2e:
    name: vault-client e2e (testnet)
    runs-on: ubuntu-latest
    env:
      CKB_RPC: ${{ vars.TESTNET_RPC_URL || 'https://testnet.ckbapp.dev/rpc' }}
      OWNER_PRIVKEY: ${{ secrets.TESTNET_OWNER_PRIVKEY }}
      CHARITY_ADDRESSES: ${{ secrets.TESTNET_CHARITY_ADDRESSES }}
      VAULT_CODE_HASH: ${{ vars.TESTNET_VAULT_CODE_HASH }}
      VAULT_CODE_TX_HASH: ${{ vars.TESTNET_VAULT_CODE_TX_HASH }}
      VAULT_CODE_INDEX: "0"
      VAULT_HASH_TYPE: data1
      # 10% here (vs. the contract's normal 2.5% default) purely so the --short
      # scenario's required share stays comfortably above the 61 CKB minimum
      # cell size without needing a very large withdrawal. This only affects
      # this disposable test vault, not any other deployment's configuration.
      RATE_BPS: "1000"
      # required = withdrawn * RATE_BPS / 10000, so with a 10% rate:
      #   step 3 (split):  800 CKB -> required  80 CKB (split 61+62=123 covers it)
      #   step 4 (short):  1000 CKB -> required 100 CKB, 70% = 70 CKB (>= 61, so it
      #                    reaches the contract and is correctly rejected there)
      #   step 5 (final):  200 CKB -> required  20 CKB, bumped up to the 61 CKB minimum
      # Total spent from the vault: 800 + 200 = 1000 CKB (the --short attempt is
      # rejected on-chain and consumes nothing), out of the 3000 CKB created.
      CREATE_AMOUNT_CKB: ${{ vars.TESTNET_CREATE_AMOUNT_CKB || '3000' }}
      WITHDRAW_AMOUNT_CKB: ${{ vars.TESTNET_WITHDRAW_AMOUNT_CKB || '800' }}
      SPLIT_SPEC: "61,62"
      SHORT_AMOUNT_CKB: ${{ vars.TESTNET_SHORT_AMOUNT_CKB || '1000' }}
      FINAL_AMOUNT_CKB: ${{ vars.TESTNET_FINAL_AMOUNT_CKB || '200' }}
      WAIT_MAX_TRIES: "60"
      WAIT_INTERVAL_SECS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets/variables are set
        run: |
          missing=0
          for v in OWNER_PRIVKEY CHARITY_ADDRESSES VAULT_CODE_HASH VAULT_CODE_TX_HASH; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret/variable: $v (see workflow file comments for setup)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run testnet e2e smoke test
        run: ./scripts/e2e-vault-client.sh
